<style>
:root{--bg:#080b12;--panel:#101622;--panel2:#151d2b;--line:#242e40;--text:#f1f5ff;--muted:#8996ad;--blue:#2878ff;--blue2:#1555ce;--green:#43d6a0;--red:#ff647c;--gold:#ffca70;--radius:19px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 75% -12%,#182a4a 0,transparent 38%),var(--bg);color:var(--text);font:14px Manrope,system-ui,sans-serif;padding:0 0 calc(86px + env(safe-area-inset-bottom));min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:13px 17px;background:#080b12eF;backdrop-filter:blur(18px);border-bottom:1px solid #1d2635}.brand{display:flex;align-items:center;gap:9px;font:700 16px 'Space Grotesk';letter-spacing:-.4px}.brand-mark{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#4a91ff,#1452c7);box-shadow:0 5px 18px #1764ee55;font-weight:800}.balance-pill{border:1px solid #29364b;background:#121a29;border-radius:99px;padding:8px 11px;font-weight:800;font-size:12px}.balance-pill span{color:var(--green)}main{max-width:680px;margin:auto}.hero{padding:23px 17px 18px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#74a8ff;font-weight:800;text-transform:uppercase}.hero h1{font:700 25px/1.22 'Space Grotesk';letter-spacing:-.8px;margin:9px 0}.hero h1 em{font-style:normal;color:#5e9aff}.hero p{margin:0;color:var(--muted);line-height:1.6;font-size:12px;max-width:390px}.hero-stat{display:flex;gap:8px;margin-top:18px}.stat{flex:1;border:1px solid #26334a;background:linear-gradient(145deg,#121c2c,#0e1420);border-radius:14px;padding:11px}.stat strong{display:block;font:700 16px 'Space Grotesk'}.stat small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:9px 17px 11px}.section-head h2{font:700 15px 'Space Grotesk';margin:0}.section-head small{color:var(--muted);font-size:11px}.search{padding:0 17px 12px}.search input{width:100%;border:1px solid var(--line);background:#101622;border-radius:13px;padding:12px 14px;color:var(--text);outline:none}.search input:focus,input:focus,textarea:focus,select:focus{border-color:#367fff}.chips{display:flex;gap:7px;overflow:auto;padding:0 17px 15px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #273146;background:#101622;border-radius:10px;padding:8px 12px;color:#9aa8bf;font-size:11px;font-weight:700}.chip.active{background:#1d5fd5;border-color:#3981ff;color:white;box-shadow:0 4px 14px #1555ce30}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 13px}.product{min-width:0;overflow:hidden;border:1px solid #222d3f;border-radius:17px;background:linear-gradient(145deg,#151e2d,#0e131d);transition:transform .18s,border-color .18s;animation:rise .3s both}.product:active{transform:scale(.985)}.product-art{height:108px;position:relative;overflow:hidden;background:#121b2b}.product-art img{width:100%;height:100%;object-fit:cover;opacity:.74;transition:transform .35s}.product:hover .product-art img{transform:scale(1.04)}.product-art:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#111722 0%,transparent 75%)}.product-icon{position:absolute;left:11px;bottom:9px;z-index:1;width:31px;height:31px;display:grid;place-items:center;background:#182945;border:1px solid #45628c;border-radius:11px;font-weight:800;color:#8bb7ff}.stock{position:absolute;right:8px;top:8px;z-index:1;background:#07130fce;color:#59e0b0;border:1px solid #28634e;border-radius:99px;padding:5px 7px;font-size:9px;font-weight:800}.stock.out{color:#ff8495;background:#210e15d9;border-color:#69303c}.product-body{padding:10px 11px 12px}.product h3{font:700 13px 'Space Grotesk';margin:0 0 5px;line-height:1.35}.product p{color:var(--muted);font-size:10px;line-height:1.45;margin:0;min-height:29px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.product-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:5px}.from{font:700 12px 'Space Grotesk'}.from small{display:block;font:500 9px Manrope;color:var(--muted);margin-bottom:2px}.arrow{width:29px;height:29px;display:grid;place-items:center;border:0;border-radius:10px;background:#1c5fd6;font-size:18px}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:7px}.page-title{font:700 23px 'Space Grotesk';margin:23px 17px 6px}.page-sub{margin:0 17px 17px;color:var(--muted);font-size:12px;line-height:1.55}.panel{margin:11px 13px;padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#131b29,#0e131d)}.panel h3{font:700 14px 'Space Grotesk';margin:0 0 12px}.muted{color:var(--muted)}.big-number{font:700 29px 'Space Grotesk';letter-spacing:-1px;margin:7px 0}.field{display:block;width:100%;background:#090e17;border:1px solid #293449;color:var(--text);padding:12px;border-radius:11px;outline:none;margin:7px 0}.field::placeholder{color:#66758e}textarea.field{resize:vertical;min-height:75px}.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-radius:12px;padding:13px 14px;background:linear-gradient(100deg,#2878ff,#1555ce);color:white;font-weight:800;font-size:12px;margin-top:9px;box-shadow:0 6px 18px #1655ca25}.btn.secondary{background:#182233;border:1px solid #2b384d;box-shadow:none;color:#e3eaff}.btn.danger{background:#361722;border:1px solid #653043;box-shadow:none;color:#ff9cac}.btn:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.mini-stat{background:#0b111c;border:1px solid #263146;border-radius:13px;padding:12px}.mini-stat small{display:block;color:var(--muted);font-size:10px}.mini-stat b{display:block;font:700 17px 'Space Grotesk';margin-top:5px}.entry{padding:13px 0;border-bottom:1px solid #222d3e}.entry:last-child{border-bottom:0}.entry-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.entry-title{font-weight:800;font-size:12px}.entry-meta{color:var(--muted);font-size:10px;margin-top:5px}.status{font-size:9px;font-weight:800;border-radius:7px;padding:5px 7px;background:#122b23;color:var(--green)}.status.wait{background:#302615;color:var(--gold)}.key{font:11px ui-monospace,monospace;overflow-wrap:anywhere;background:#090e17;border:1px solid #263146;border-radius:10px;padding:10px;margin-top:9px;color:#a7c8ff}.copy{color:#7fb0ff;font-size:10px;float:right;border:0;background:none}.bottom-nav{position:fixed;z-index:15;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px 4px calc(7px + env(safe-area-inset-bottom));background:#0a0e16f5;border-top:1px solid #202a3b;backdrop-filter:blur(20px)}.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:#76859e;font-size:9px;font-weight:700;padding:5px 1px}.nav-btn .ico{font-size:17px;line-height:20px}.nav-btn.active{color:#69a0ff}.nav-btn.active .ico{filter:drop-shadow(0 0 7px #2878ff66)}.sheet{display:none;position:fixed;inset:0;z-index:30;background:#02050bc9;align-items:flex-end;backdrop-filter:blur(5px)}.sheet.show{display:flex;animation:fade .16s}.sheet-inner{width:100%;max-height:87vh;overflow:auto;background:#101722;border:1px solid #29364a;border-bottom:0;border-radius:23px 23px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));animation:rise .2s}.grab{width:36px;height:4px;border-radius:9px;background:#43516a;margin:-8px auto 17px}.sheet-title{font:700 20px 'Space Grotesk';margin:0 0 7px}.pack{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px;width:100%;border:1px solid #2a3850;background:#141e2d;border-radius:13px;padding:13px;margin-top:9px}.pack strong{display:block;font-size:12px}.pack small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.pack b{font:700 13px 'Space Grotesk';white-space:nowrap}.divider{height:1px;background:#263146;margin:15px 0}.notice{background:#17243a;border:1px solid #2a4673;border-radius:12px;padding:11px;color:#a8c8ff;font-size:11px;line-height:1.5;margin-top:10px}.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #263146;font-size:12px}.toggle{accent-color:#2878ff;width:19px;height:19px}.section-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#7b8aa3;font-weight:800;margin:18px 0 8px}.admin-tabs{display:flex;gap:7px;overflow:auto;padding:0 13px 6px}.admin-tabs button{white-space:nowrap}.badge{display:inline-block;border:1px solid #2b3b55;border-radius:7px;padding:4px 6px;font-size:9px;color:#9eb9e8}.loader{margin:35px auto;border:2px solid #29364b;border-top-color:#4e91ff;border-radius:50%;width:25px;height:25px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(min-width:520px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.product-art{height:125px}.hero h1{font-size:30px}}
</style></head><body>
<header><div class="brand"><span class="brand-mark">T</span><span id="brandName">TRICK | API</span></div><button class="balance-pill" onclick="go('profile')">● <span id="headerBalance">$0.00</span></button></header><main id="app"><div class="loader"></div></main><nav class="bottom-nav" id="nav"></nav><div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-inner" id="sheetContent"></div></div>
<script>
'use strict';const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#080b12');tg?.setBackgroundColor?.('#080b12');
const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S=null,tab='shop',cat='Все',search='',adminTab='overview';
const icons={'Текст':'✳','Изображения':'◈','Аудио':'♫','Видео':'▶'};
async function call(a,b={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch('/api/'+a,{method:'POST',headers:{'X-Init':tg?.initData||'', 'Content-Type':'application/json'},body:JSON.stringify(b),signal:controller.signal,cache:'no-store'});let d;try{d=await r.json()}catch{d={error:'Сервер вернул некорректный ответ'}}if(!r.ok||d.error)throw Error(d.error||('Ошибка запроса ('+r.status+')'));return d}catch(e){if(e.name==='AbortError')throw Error('Сервер отвечает слишком долго. Проверь соединение и попробуй еще раз.');if(e instanceof TypeError)throw Error('Не удалось подключиться к серверу. Проверь интернет и попробуй еще раз.');throw e}finally{clearTimeout(timer)}}
function toast(t){if(tg?.showAlert)tg.showAlert(String(t));else alert(String(t))}
async function load(keep=true){const app=$('#app');if(!S)app.innerHTML='<div class="empty"><div class="loader"></div><b>Подключаем магазин…</b><span>Обычно это занимает пару секунд.</span></div>';try{S=await call('init');$('#brandName').textContent=S.shop_name||'TRICK | API';document.title=S.shop_name||'AI Store';$('#headerBalance').textContent=money(S.me.balance);render()}catch(e){const hint=(!tg?.initData)?'<p class="muted">Открой Mini App через кнопку в Telegram-боте. Для проверки в браузере Telegram-авторизация недоступна.</p>':'';app.innerHTML=`<div class="empty"><b>Не удалось загрузить магазин</b><p>${esc(e.message||'Неизвестная ошибка')}</p>${hint}<button class="btn" onclick="load()">Повторить</button></div>`}}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(!S)return;$('#headerBalance').textContent=money(S.me.balance);const nav=[['shop','⌂','Магазин'],['keys','▤','Ключи'],['partners','♧','Друзья'],['docs','⌘','Как работать'],['profile','◉','Профиль']];if(S.admin)nav.push(['admin','⚙','Админ']);$('#nav').innerHTML=nav.map(([id,ico,label])=>`<button class="nav-btn ${tab===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');const views={shop:shopView,keys:keysView,partners:partnersView,docs:docsView,profile:profileView,admin:adminView};$('#app').innerHTML=(views[tab]||shopView)()}
function shopView(){const cats=['Все',...new Set(S.products.map(p=>p.cat).filter(Boolean))];let ps=S.products.filter(p=>(cat==='Все'||p.cat===cat)&&(`${p.name} ${p.descr} ${p.cat}`).toLowerCase().includes(search.toLowerCase()));return `<section class="hero"><div class="eyebrow">AI ACCESS · DIGITAL GOODS</div><h1>Доступ к <em>искусственному</em><br>интеллекту</h1><p>Ключи и доступы к популярным AI-сервисам. Выбери нужный инструмент и пакет — получение после оплаты занимает несколько секунд.</p><div class="hero-stat"><div class="stat"><strong>${S.products.length}+</strong><small>AI-продуктов</small></div><div class="stat"><strong>${S.keys.length}</strong><small>Мои покупки</small></div><div class="stat"><strong>${money(S.me.balance)}</strong><small>Твой баланс</small></div></div></section><div class="section-head"><h2>Каталог сервисов</h2><small>${ps.length} позиций</small></div><div class="search"><input placeholder="⌕  Поиск AI-сервиса..." value="${esc(search)}" oninput="search=this.value;const y=window.scrollY;render();window.scrollTo(0,y)"></div><div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'active':''}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div class="products">${ps.map((p,i)=>{let min=p.packs.length?Math.min(...p.packs.map(x=>+x.price)):0;return `<article class="product" style="animation-delay:${Math.min(i*30,240)}ms" onclick="openProduct('${esc(p.id)}')"><div class="product-art"><img loading="lazy" src="${esc(p.img||'')}" alt="" onerror="this.style.display='none'"><span class="product-icon">${icons[p.cat]||'✦'}</span><span class="stock ${p.stock?'':'out'}">${p.stock?'● В НАЛИЧИИ':'НЕТ КЛЮЧЕЙ'}</span></div><div class="product-body"><h3>${esc(p.name)}</h3><p>${esc(p.descr||'Цифровой доступ к AI-сервису')}</p><div class="product-foot"><span class="from"><small>от</small>${money(min)}</span><button class="arrow" aria-label="Открыть">↗</button></div></div></article>`}).join('')}</div>${ps.length?'':'<div class="empty"><b>Ничего не найдено</b>Попробуй изменить запрос или категорию.</div>'}`}
function openProduct(id){const p=S.products.find(x=>x.id===id);if(!p)return;sheet(`<div class="grab"></div><div class="eyebrow">${esc(p.cat||'AI SERVICE')}</div><h2 class="sheet-title">${esc(p.name)}</h2><p class="muted" style="font-size:12px;line-height:1.6">${esc(p.descr||'Цифровой доступ к AI-сервису')}</p><div class="notice">${p.stock?`В наличии: ${p.stock} ключей`:'Ключи временно закончились. Попробуй позже.'} · Баланс: ${money(S.me.balance)}</div><div class="section-label">Выбери пакет</div>${p.packs.map(k=>`<button class="pack" onclick="buy(${Number(k.id)})" ${!p.stock?'disabled':''}><span><strong>${esc(k.label)}</strong><small>Цифровой ключ · автоматическая выдача</small></span><b>${money(k.price)}　→</b></button>`).join('')||'<p class="muted">Пакеты пока не настроены.</p>'}<button class="btn secondary" onclick="closeSheet()">Назад в каталог</button>`)}
function sheet(html){$('#sheetContent').innerHTML=html;$('#sheet').classList.add('show')}function closeSheet(){$('#sheet').classList.remove('show')}
async function buy(id){try{const r=await call('buy',{pack:id});S=await call('init');sheet(`<div class="grab"></div><div style="font-size:30px">✓</div><h2 class="sheet-title">Покупка завершена</h2><p class="muted">Твой ключ готов. Сохрани его в надежном месте.</p><div class="key">${esc(r.code)}<button class="copy" onclick="copyText('${esc(r.code)}')">Копировать</button></div><button class="btn" onclick="closeSheet();go('keys')">Перейти к моим ключам</button>`);render()}catch(e){toast(e.message)}}
function keysView(){return `<h1 class="page-title">Мои ключи</h1><p class="page-sub">Все купленные ключи собраны здесь. Нажми «Копировать», чтобы сохранить ключ.</p><div class="panel"><div class="row"><div class="mini-stat"><small>Покупок</small><b>${S.keys.length}</b></div><div class="mini-stat"><small>Потрачено</small><b>${money(S.spent)}</b></div></div>${S.keys.length?S.keys.map(k=>`<div class="entry"><div class="entry-top"><span class="entry-title">${esc(k.pid)} · ${esc(k.label)}</span><span class="status">Выдан</span></div><div class="entry-meta">${new Date(k.ts*1000).toLocaleString()}</div><div class="key">${esc(k.code)}<button class="copy" onclick="copyText('${esc(k.code)}')">Копировать</button></div></div>`).join(''):'<div class="empty"><b>Пока нет покупок</b>Выбери сервис в каталоге, и ключ появится здесь.<button class="btn" onclick="go(\'shop\')">Открыть каталог</button></div>'}</div>`}
function partnersView(){const link=`https://t.me/${S.bot}?start=ref_${S.me.id}`;return `<h1 class="page-title">Партнерская программа</h1><p class="page-sub">Приглашай друзей и получай 5% от их пополнений. Начисления автоматически поступают на твой баланс.</p><div class="panel"><div class="row"><div class="mini-stat"><small>Приглашено</small><b>${S.invited}</b></div><div class="mini-stat"><small>Заработано</small><b>${money(S.me.earned)}</b></div></div><div class="section-label">Твоя ссылка</div><div class="key">${link}</div><button class="btn" onclick="copyText('${link}')">Скопировать ссылку</button><button class="btn secondary" onclick="tg?.openTelegramLink?.('https://t.me/share/url?url=${encodeURIComponent(link)}')">Отправить другу ↗</button></div><div class="panel"><h3>Как это работает</h3><div class="entry"><b>01 · Поделись ссылкой</b><div class="entry-meta">Отправь ее друзьям или размести в своем канале.</div></div><div class="entry"><b>02 · Друг пополняет баланс</b><div class="entry-meta">После успешной оплаты система фиксирует пополнение.</div></div><div class="entry"><b>03 · Получи 5%</b><div class="entry-meta">Вознаграждение начисляется автоматически.</div></div></div>`}
function docsView(){return `<h1 class="page-title">Как это работает</h1><p class="page-sub">Короткая инструкция по покупке цифрового доступа.</p><div class="panel">${[['01','Выбери сервис','Открой каталог, выбери AI-продукт и подходящий пакет.'],['02','Пополнить баланс','В профиле выбери доступный способ оплаты и создай счет.'],['03','Купи ключ','После пополнения вернись к сервису и нажми на нужный пакет.'],['04','Забери ключ','Ключ отобразится сразу после покупки и сохранится в разделе «Мои ключи».']].map(x=>`<div class="entry"><div style="color:#6ba3ff;font:700 12px 'Space Grotesk'">${x[0]}</div><div style="font-weight:800;margin-top:5px">${x[1]}</div><div class="entry-meta">${x[2]}</div></div>`).join('')}</div><div class="panel"><h3>Нужна помощь?</h3><p class="muted" style="font-size:12px;line-height:1.6">Если платеж не отобразился или возникла проблема с ключом, свяжись с поддержкой.</p><button class="btn" onclick="tg?.openTelegramLink?.('https://t.me/${esc((S.support||'').replace('@',''))}')">Написать в поддержку ↗</button></div>`}
function profileView(){let methods=S.methods||{};return `<h1 class="page-title">Профиль</h1><p class="page-sub">Баланс, пополнение и история операций.</p><div class="panel"><div class="eyebrow">ТВОЙ БАЛАНС</div><div class="big-number"
